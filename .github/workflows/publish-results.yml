name: publish live results
# Copies the live-results artifact of a finished live run to the live-results branch, without re-running anything.
# Trigger: push to the publish-run branch with the run id in PUBLISH_RUN_ID.txt, or Run workflow with run_id.
on:
  push:
    branches: [publish-run]
  workflow_dispatch:
    inputs:
      run_id:
        description: "id of the live run"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "id=${{ inputs.run_id || '' }}$( [ -z '${{ inputs.run_id }}' ] && cat PUBLISH_RUN_ID.txt )" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: live-results
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ github.token }}
          path: /tmp/out
      - name: push to live-results
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/out
          rm -f server.log
          ls -la
          echo "run ${{ steps.rid.outputs.id }} published $(date -u +%FT%TZ)" > RUN.txt
          git init -q && git checkout -q -b live-results
          git config user.name "live-run" && git config user.email "live-run@users.noreply.github.com"
          git add -A && git commit -qm "live results ${{ steps.rid.outputs.id }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:live-results
