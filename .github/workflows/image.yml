name: container image
# Builds the Mortgage OS image and publishes it to GitHub Container Registry, so Nebius Serverless AI
# (endpoint or job) can pull ghcr.io/alenzacodes/decision-ladder:latest. Make the package public once
# (GitHub -> Packages -> decision-ladder -> Package settings -> Change visibility) or give Nebius registry credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/alenzacodes/decision-ladder:latest
