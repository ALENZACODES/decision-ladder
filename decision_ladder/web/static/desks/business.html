<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Lending Desk · Mortgage OS</title>
<style>
  :root { --ink:#1b2430; --muted:#5d6b7a; --line:#dde3ea; --bg:#f6f8fa; --card:#fff; --accent:#1f5f99; --bad:#a32020; --warn:#8a5a00; --ok:#1d6b3a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:20px 28px 8px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:var(--muted); max-width:70ch; }
  nav { display:flex; flex-wrap:wrap; gap:6px; padding:10px 28px; border-bottom:1px solid var(--line); }
  nav button { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:16px; cursor:pointer; font:inherit; }
  nav button[aria-selected="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { display:grid; grid-template-columns:minmax(300px, 420px) 1fr; gap:20px; padding:20px 28px; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .card h2 { margin:0 0 4px; font-size:17px; }
  .card .blurb { color:var(--muted); margin:0 0 12px; font-size:13.5px; }
  label { display:block; margin:8px 0 2px; font-size:13px; color:var(--muted); }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  textarea { min-height:64px; font-family:ui-monospace, monospace; font-size:13px; }
  input[type=checkbox] { width:auto; margin-right:6px; }
  .check label { display:flex; align-items:center; color:var(--ink); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  button.run { margin-top:14px; background:var(--accent); color:#fff; border:0; padding:8px 18px; border-radius:5px; font:inherit; cursor:pointer; }
  table { border-collapse:collapse; width:100%; margin:6px 0 12px; font-size:14px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .flag { padding:8px 12px; border-radius:5px; margin:8px 0; font-weight:600; }
  .flag.bad { background:#fbeaea; color:var(--bad); }
  .flag.warn { background:#fff4e0; color:var(--warn); }
  .flag.ok { background:#e8f5ec; color:var(--ok); }
  .src { font-size:12.5px; color:var(--muted); }
  .src a { color:var(--accent); word-break:break-all; }
  details { margin-top:10px; }
  pre { background:var(--bg); padding:10px; border-radius:5px; overflow:auto; font-size:12px; max-height:380px; }
  .err { color:var(--bad); font-weight:600; }
</style>
<style>
header { background: linear-gradient(90deg, rgba(13,23,38,.95) 0%, rgba(13,23,38,.82) 55%, rgba(13,23,38,.35) 100%),
         url("/static/img/desks/business-cover.jpg") center / cover no-repeat, #0d1726; color: #fff; }
header h1, header p, header a { color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Business Lending Desk</h1>
  <p>CSBFP loans, invoice factoring, unsecured credit with the criminal-rate check, borrower DSCR capacity and equipment
     lease versus buy. Every figure comes from a deterministic engine; program parameters show where and when they were checked.</p>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
  <section class="card" id="form-card"></section>
  <section class="card" id="result"><p class="blurb">Run a calculator to see results.</p></section>
</main>
<script src="business.js"></script>
</body>
</html>
